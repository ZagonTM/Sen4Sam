# Conda environment for the SAM 2 x Sen4AgriNet project.
# Reproducible dependency list — the environment name is arbitrary.
name: sen4sam
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - numpy
  - pandas
  - matplotlib
  - scipy
  - tifffile
  - pillow
  - netCDF4          # read the Sen4AgriNet .nc patches
  - requests         # HuggingFace API + downloads
  - pip:
      # torch/torchvision pick the right backend for the machine (CUDA / MPS / CPU).
      - torch
      - torchvision
      # SAM 2 (official Meta implementation), pip-installed from git:
      #   pip install "git+https://github.com/facebookresearch/sam2.git"
      - git+https://github.com/facebookresearch/sam2.git
